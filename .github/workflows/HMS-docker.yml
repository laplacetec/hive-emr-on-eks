name: Docker
on:
  release:
    types: [created]
  push:
    branches: [ main ]
    # # Publish spark version tags as releases.
    # tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aws-samples/hive-metastore
  HMS_VERSION_TAG: 3.0.0


jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: docker/
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.HMS_VERSION_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

  # PR-only: build each 3.x version we patch (never pushed) and prove the
  # HIVE-25879 backport made it into the jar that ships in the final image.
  verify-hive-25879:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        hive: ["3.0.0", "3.1.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (load only, no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/
          push: false
          load: true
          build-args: HIVE_VERSION=${{ matrix.hive }}
          tags: hms-verify:${{ matrix.hive }}
      - name: Patched self-test query is in the shipped jar
        run: |
          docker run --rm --entrypoint sh hms-verify:${{ matrix.hive }} -c '
            set -eu
            cd /tmp
            jar xf /opt/hive-metastore/lib/hive-standalone-metastore-${0}.jar org/apache/hadoop/hive/metastore/MetaStoreDirectSql.class
            grep -aq "WHERE \"DB_ID\"=1" org/apache/hadoop/hive/metastore/MetaStoreDirectSql.class
            echo "patched: hive-standalone-metastore-${0}.jar"
          ' "${{ matrix.hive }}"
